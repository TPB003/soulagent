[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Dependencies are pinned in foundry.lock:
#   @openzeppelin/contracts v5.6.1 (5fd1781b1454fd1ef8e722282f86f9293cacf256)
#   forge-std v1.11.0 (8e40513d678f392f398620b3ef2b418648b33e89)
# The live Base Sepolia deployment was solc 0.8.30 with the optimizer off.
# Rebuilds of this fix use the optimizer (200 runs) and Cancun (OZ 5.6 needs mcopy).
